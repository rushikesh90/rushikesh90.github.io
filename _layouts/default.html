<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
        :root {
            --accent: #0f766e;
            --border: #d8dee4;
            --ink: #1f2937;
            --muted: #667085;
            --soft: #f6f8fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.65;
            margin: 0;
        }

        .site-header,
        .site-main,
        .site-footer {
            margin: 0 auto;
            max-width: 880px;
            padding: 24px 20px;
        }

        .site-header {
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        .site-title {
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
        }

        .site-footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
        }

        h1,
        h2,
        h3 {
            line-height: 1.2;
        }

        h1 {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            margin-top: 0;
        }

        article h1 {
            font-size: clamp(1.6rem, 3vw, 2.15rem);
        }

        article h2 {
            font-size: clamp(1.25rem, 2.4vw, 1.65rem);
            margin-top: 2rem;
        }

        a {
            color: var(--accent);
            font-weight: 700;
            text-underline-offset: 0.18em;
        }

        pre,
        code {
            background: var(--soft);
            border-radius: 6px;
        }

        code {
            padding: 0.1rem 0.25rem;
        }

        pre {
            overflow-x: auto;
            padding: 16px;
        }

        pre code {
            padding: 0;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <a href="https://github.com/rushikesh90/rushikesh90.github.io">GitHub</a>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>{{ site.description }}</p>
    </footer>
</body>
</html>
